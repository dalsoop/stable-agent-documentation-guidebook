# Vale checks the English part of DESIGN.md §11 (decisions/0005).
# The style Abstract checks first person in the published layers (DESIGN.md §13, decisions/0009).
# docs_checks.py reads the sections with Abstract as the scope of the abstraction check.
StylesPath = .github/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = STE

[{DESIGN.md,README.md,guides/*.md,practices/*.md,principles/*.md}]
BasedOnStyles = STE, Abstract

[{AGENTS.md,guides/new-repository.md,guides/new-project.md,guides/notes.md,guides/templates/*.md}]
BasedOnStyles = STE, STEProcedure, Abstract

# The header line of a reference keeps the original title of the source.
[REFERENCES.md]
BasedOnStyles = STE
TokenIgnores = (\*\*\[\d+\]\*\*[^\n]*)
