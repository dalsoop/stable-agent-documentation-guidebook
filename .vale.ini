# Vale checks the English part of DESIGN.md §11 (decisions/0005).
StylesPath = .github/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = STE

[{AGENTS.md,guides/new-project.md,guides/templates/*.md}]
BasedOnStyles = STE, STEProcedure

# The header line of a reference keeps the original title of the source.
[REFERENCES.md]
BasedOnStyles = STE
TokenIgnores = (\*\*\[\d+\]\*\*[^\n]*)
