name: english-only

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when a tracked file contains Hangul (decisions/0005)
        run: |
          if git ls-files -z | xargs -0 perl -CSD -ne 'if (/[\x{1100}-\x{11FF}\x{3130}-\x{318F}\x{AC00}-\x{D7A3}]/) { print "$ARGV:$.: $_"; $found = 1 } close ARGV if eof; END { $? = $found ? 1 : 0 }'; then
            echo "english-only: OK"
          else
            echo "english-only: Hangul found. Write every file in English (decisions/0005-english-only.md)."
            exit 1
          fi
